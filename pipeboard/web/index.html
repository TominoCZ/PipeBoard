<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PipeBoard</title>
<link rel="stylesheet" href="board.css">
<link rel="icon" href="icon.svg">
</head>
<body>
<!-- the diagnostic cards' dashed edge: L's colour to R's (board.css --diag-l, --diag-r), across each card -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="diag-edge-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--diag-l)"/><stop offset="1" style="stop-color:var(--diag-r)"/></linearGradient></defs></svg>
<main id="board" aria-label="Audio routing board">
  <div id="grid"></div>
  <div id="world">
    <svg id="wires" aria-hidden="true"><defs id="grads"></defs><g id="wire-layer"></g><g id="portal-layer"></g></svg>
    <div id="cards"></div>
  </div>
  <p id="empty" hidden>No audio devices yet.<br><small>Is PipeWire running?</small></p>
</main>
<header id="bar">
  <span class="brand">PipeBoard</span>
  <span id="status" class="status" title="Connection">connecting…</span>
  <!-- The bar (owner's pick W2): every control one height; the engine readout a real button -->
  <button id="clock" type="button" class="clock" aria-haspopup="dialog" title="Audio engine: block size, safety margin, scheduling">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"><path d="M2 4h6M11 4h1M2 10h1M6 10h6"/><circle cx="9.5" cy="4" r="1.5"/><circle cx="4.5" cy="10" r="1.5"/></svg><span id="clock-text"></span><svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"><path d="M4 5.5l3 3 3-3"/></svg>
  </button>
  <button id="profile" type="button" class="profile" hidden title="Profiles: save, load, load at launch">
    <span id="profile-name">Default</span><small id="profile-note"></small><svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"><path d="M4 5.5l3 3 3-3"/></svg>
  </button>
  <span class="bar-sep"></span>
  <button id="add" type="button" class="accent" title="Add to the board (or right-click the board)">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"><path d="M7 2.5v9M2.5 7h9"/></svg>Add
  </button>
  <button id="fit" type="button" title="Show everything (F)">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"><path d="M2 5V2h3M9 2h3v3M12 9v3H9M5 12H2V9"/></svg><span class="lbl">Fit</span>
  </button>
  <!-- Tidy, and its one option (Portals) in the menu behind its arrow -->
  <span class="split" role="group" aria-label="Tidy">
    <button id="tidy" type="button" title="Arrange the cards left to right by signal flow">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"><rect x="1.5" y="2.5" width="4" height="3" rx="0.8"/><rect x="8.5" y="2.5" width="4" height="3" rx="0.8"/><rect x="1.5" y="8.5" width="4" height="3" rx="0.8"/><rect x="8.5" y="8.5" width="4" height="3" rx="0.8"/></svg><span class="lbl">Tidy</span>
    </button>
    <button id="tidy-more" type="button" class="more" aria-haspopup="menu" aria-label="Tidy options" title="Tidy options"><svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"><path d="M4 5.5l3 3 3-3"/></svg></button>
  </span>
  <span class="bar-sep"></span>
  <!-- How wires show the sound: Still, Flowing or Instant (was Animate and its Instant switch) -->
  <button id="wires-btn" type="button" aria-haspopup="menu" title="How the wires show the sound">
    <svg id="wires-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></svg><span class="k">Wires</span><span id="wires-mode"></span><svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"><path d="M4 5.5l3 3 3-3"/></svg>
  </button>
  <label class="bar-check" title="Show each effect's delay and each device's total">
    <input id="show-latency" type="checkbox">Show latency
  </label>
</header>
<button id="problems-btn" type="button" class="problems-btn" aria-expanded="false"
        aria-controls="problems" title="Problems in the graph">
  <span class="sev-dot"></span><span id="problems-count">All good</span>
</button>
<section id="problems" class="panel" hidden aria-label="Problems">
  <h2>Problems</h2>
  <ol id="problem-list"></ol>
</section>
<aside id="changes" class="changes" hidden aria-live="polite">
  <strong id="changes-title"></strong>
  <ul id="change-list"></ul>
  <div class="actions">
    <button id="revert-changes" type="button">Revert</button>
    <button id="save-changes" type="button" class="primary">Save</button>
  </div>
</aside>
<div id="unlink" class="chip" hidden>
  <button id="chip-insert" type="button" title="Put a node in the middle of this wire">＋ Insert</button>
  <button id="chip-disconnect" type="button" title="Disconnect (Delete)">✕ Disconnect</button>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="drag-side" class="drag-side" aria-hidden="true" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<pre id="audit" hidden></pre>
<script src="field.js"></script>
<script src="eq.js"></script>
<script src="dynamics.js"></script>
<script src="diag.js"></script>
<script src="board.js"></script>
</body>
</html>
